<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie Géopolitique — Groenland</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c18;
    --bg2: #0c1020;
    --panel: #0e1528;
    --border: rgba(255,255,255,0.1);
    --text: #e8eaf6;
    --text-dim: #7986a8;
    --accent: #64b5f6;
    --panel-w: 370px;
    --collapse-w: 28px;

    --c-state: #7986ff;
    --c-industry: #ff6b6b;
    --c-civil: #69db7c;
    --c-science: #ffe066;
    --c-territory: #cc5de8;
    --c-dk: #e8a045;
    --c-eu: #5b9bd5;
    --c-cn: #e05555;
    --c-us: #7986ff;
    --c-ru: #e04040;

    --l-finance: #69db7c;
    --l-regulation: #7986ff;
    --l-influence: #ff6b6b;
    --l-support: #cc5de8;
    --l-expertise: #ffe066;
    --l-tension: #ff9a5c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; overflow-x: hidden; }

  /* ── FILTERS ── */
  #filters {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--bg2);
  }
  .filter-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 20px; border: 1px solid transparent;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
    background: rgba(255,255,255,0.05); color: var(--text-dim); letter-spacing: 0.04em;
  }
  .filter-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .filter-btn.active { color: var(--text); background: rgba(255,255,255,0.1); }
  .filter-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); }
  .filter-btn[data-cat="all"].active { border-color: var(--accent); color: var(--accent); }

  /* ── LEGEND ── */
  #legend-relations {
    display: flex; flex-wrap: wrap; gap: 10px 22px;
    justify-content: center; padding: 10px 20px;
    border-bottom: 1px solid var(--border); background: var(--bg2);
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-dim);
    cursor: pointer; transition: color 0.2s; user-select: none;
  }
  .legend-item:hover, .legend-item.active { color: var(--text); }
  .legend-line { width: 28px; height: 2px; border-radius: 2px; flex-shrink: 0; }
  .legend-dashed { width: 28px; height: 0; border-top: 2px dashed; flex-shrink: 0; }

  /* ── MAP WRAPPER ── */
  #map-wrapper {
    position: relative;
    width: 100%;
    max-width: 1820px;
    margin: 0 auto;
    /* height set by JS to match SVG rendered height */
  }

  #map-container {
    width: 100%;
    padding: 16px 0 32px;
  }

  #map-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ── DETAIL PANEL (overlay, anchored to map-wrapper) ── */
  #detail-panel {
    position: absolute;
    top: 0; right: 0;
    /* height set by JS */
    width: calc(var(--panel-w) + var(--collapse-w));
    display: flex;
    flex-direction: row;
    z-index: 500;
    pointer-events: none;
    transform: translateX(calc(var(--panel-w)));
    transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
  }
  #detail-panel.open {
    transform: translateX(0);
    pointer-events: all;
  }

  /* The collapse tab — full height, always visible when panel is open, clickable */
  #collapse-tab {
    width: var(--collapse-w);
    flex-shrink: 0;
    background: linear-gradient(180deg, rgba(100,181,246,0.18) 0%, rgba(100,181,246,0.08) 100%);
    border-left: 2px solid rgba(100,181,246,0.4);
    border-top: 1px solid rgba(100,181,246,0.2);
    border-bottom: 1px solid rgba(100,181,246,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: all;
    transition: background 0.2s, border-color 0.2s;
    position: relative;
    border-radius: 8px 0 0 8px;
    backdrop-filter: blur(8px);
  }
  #collapse-tab:hover {
    background: linear-gradient(180deg, rgba(100,181,246,0.28) 0%, rgba(100,181,246,0.14) 100%);
    border-color: rgba(100,181,246,0.65);
  }
  /* Single clean chevron icon */
  #collapse-tab svg.tab-icon {
    width: 12px;
    height: 22px;
    opacity: 0.8;
    transition: opacity 0.2s, transform 0.35s;
    flex-shrink: 0;
  }
  #collapse-tab:hover svg.tab-icon { opacity: 1; }
  /* Flip to > when open */
  #detail-panel.open #collapse-tab svg.tab-icon {
    transform: scaleX(-1);
  }
  /* When panel is closed, only the tab is clickable */
  #detail-panel:not(.open) { pointer-events: none; }
  #detail-panel:not(.open) #collapse-tab {
    pointer-events: all;
    background: linear-gradient(180deg, rgba(100,181,246,0.22) 0%, rgba(100,181,246,0.1) 100%);
  }

  /* Panel body */
  #panel-body {
    width: var(--panel-w);
    background: rgba(10,15,32,0.97);
    border-left: 1px solid rgba(100,181,246,0.2);
    border-top: 1px solid rgba(100,181,246,0.15);
    border-bottom: 1px solid rgba(100,181,246,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(20px);
    box-shadow: -16px 0 48px rgba(0,0,0,0.7);
  }

  #panel-header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: rgba(14,21,40,0.99);
  }
  .d-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    font-family: 'IBM Plex Mono', monospace; margin-bottom: 10px;
  }
  #panel-header h2 {
    font-family: 'Cinzel', serif; font-size: 17px; color: var(--text); line-height: 1.3;
  }

  #panel-scroll {
    overflow-y: auto;
    flex: 1;
    padding: 18px 20px 24px;
  }
  #panel-scroll::-webkit-scrollbar { width: 4px; }
  #panel-scroll::-webkit-scrollbar-track { background: transparent; }
  #panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

  .d-section { margin-bottom: 20px; }
  .d-section h3 {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 9px;
    font-family: 'IBM Plex Mono', monospace;
    padding-bottom: 5px; border-bottom: 1px solid var(--border);
  }
  .d-section p { font-size: 13px; line-height: 1.65; color: var(--text); }

  .d-relations { list-style: none; }
  .d-relations li {
    font-size: 12px; padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: flex-start; gap: 8px;
  }
  .d-relations li .rel-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .d-relations li .rel-info { display: flex; flex-direction: column; gap: 2px; }
  .d-relations li .rel-target { font-weight: 600; font-size: 12px; color: var(--text); }
  .d-relations li .rel-type { font-size: 10px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.06em; }
  .d-relations li .rel-label { font-size: 11px; color: var(--text-dim); font-style: italic; }

  .d-tag {
    display: inline-block; padding: 4px 10px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px; font-size: 11px; margin: 3px 3px 0 0;
    color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
  }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed; pointer-events: none;
    background: rgba(8,12,24,0.97); border: 1px solid rgba(100,181,246,0.4);
    border-radius: 10px; padding: 14px 18px; max-width: 260px;
    z-index: 2000; opacity: 0; transform: translateY(8px);
    transition: opacity 0.18s, transform 0.18s;
    backdrop-filter: blur(16px); box-shadow: 0 12px 40px rgba(0,0,0,0.7);
  }
  #tooltip.visible { opacity: 1; transform: translateY(0); }
  #tooltip .tt-title { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 5px; letter-spacing: 0.05em; }
  #tooltip .tt-cat { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
  #tooltip .tt-desc { font-size: 12.5px; line-height: 1.55; color: var(--text); }
  #tooltip .tt-hint { font-size: 11px; color: var(--text-dim); margin-top: 9px; font-style: italic; }

  /* ── SVG STYLES ── */
  .node-group { cursor: pointer; }
  .node-group circle, .node-group rect { transition: filter 0.2s, opacity 0.3s; }
  .node-group:hover circle, .node-group:hover rect {
    filter: brightness(1.4) drop-shadow(0 0 10px currentColor);
  }
  .node-group text { pointer-events: none; }
  .link { transition: opacity 0.3s; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  .link-animated { stroke-dasharray: 7 5; animation: dash 1.8s linear infinite; }
  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; fill: rgba(255,255,255,0.28); letter-spacing: 0.1em; text-transform: uppercase; pointer-events: none; }
  @keyframes pulse { 0%,100% { r: 38; opacity: 0.12; } 50% { r: 58; opacity: 0.05; } }
  .pulse-ring { animation: pulse 2.8s ease-in-out infinite; fill: var(--accent); pointer-events: none; }
</style>
</head>
<body>

<div id="filters">
  <button class="filter-btn active" data-cat="all"><span class="dot" style="background:#fff"></span>Tous</button>
  <button class="filter-btn active" data-cat="state"><span class="dot" style="background:var(--c-state)"></span>États</button>
  <button class="filter-btn active" data-cat="industry"><span class="dot" style="background:var(--c-industry)"></span>Industrie</button>
  <button class="filter-btn active" data-cat="civil"><span class="dot" style="background:var(--c-civil)"></span>Société civile</button>
  <button class="filter-btn active" data-cat="science"><span class="dot" style="background:var(--c-science)"></span>Scientifiques</button>
  <button class="filter-btn active" data-cat="territory"><span class="dot" style="background:var(--c-territory)"></span>Territoire / Enjeux</button>
</div>

<div id="legend-relations">
  <div class="legend-item active" data-rel="finance"><div class="legend-line" style="background:var(--l-finance)"></div>Financement</div>
  <div class="legend-item active" data-rel="regulation"><div class="legend-line" style="background:var(--l-regulation)"></div>Régulation</div>
  <div class="legend-item active" data-rel="influence"><div class="legend-line" style="background:var(--l-influence)"></div>Influence / Pression</div>
  <div class="legend-item active" data-rel="support"><div class="legend-dashed" style="color:var(--l-support)"></div>Soutien / Partenariat</div>
  <div class="legend-item active" data-rel="expertise"><div class="legend-line" style="background:var(--l-expertise)"></div>Expertise / Données</div>
  <div class="legend-item active" data-rel="tension"><div class="legend-dashed" style="color:var(--l-tension)"></div>Tension / Contestation</div>
</div>

<div id="map-wrapper">
  <div id="map-container">
    <svg id="map-svg" viewBox="0 0 1820 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr-finance" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#69db7c"/></marker>
        <marker id="arr-regulation" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#7986ff"/></marker>
        <marker id="arr-influence" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#ff6b6b"/></marker>
        <marker id="arr-support" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#cc5de8"/></marker>
        <marker id="arr-expertise" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#ffe066"/></marker>
        <marker id="arr-tension" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#ff9a5c"/></marker>
        <radialGradient id="gl-center" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1a3a6a" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#080c18" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Background glow -->
      <ellipse cx="910" cy="500" rx="700" ry="440" fill="url(#gl-center)"/>

      <!-- Zone backgrounds -->
      <!-- Acteurs Globaux -->
      <rect x="20" y="20" width="880" height="290" rx="14" fill="rgba(121,134,255,0.04)" stroke="rgba(121,134,255,0.15)" stroke-width="1.2"/>
      <text x="40" y="50" class="section-label" fill="rgba(121,134,255,0.55)">▸ Acteurs Globaux</text>

      <!-- Enjeux Transversaux -->
      <rect x="1220" y="20" width="580" height="290" rx="14" fill="rgba(100,181,246,0.04)" stroke="rgba(100,181,246,0.15)" stroke-width="1.2"/>
      <text x="1240" y="50" class="section-label" fill="rgba(100,181,246,0.55)">▸ Enjeux Transversaux</text>

      <!-- Industrie -->
      <rect x="20" y="300" width="570" height="420" rx="14" fill="rgba(255,107,107,0.04)" stroke="rgba(255,107,107,0.15)" stroke-width="1.2"/>
      <text x="40" y="330" class="section-label" fill="rgba(255,107,107,0.55)">▸ Industrie, Ressources & Impacts</text>

      <!-- Infrastructure & Numérique -->
      <rect x="1220" y="300" width="580" height="310" rx="14" fill="rgba(100,181,246,0.04)" stroke="rgba(100,181,246,0.15)" stroke-width="1.2"/>
      <text x="1240" y="330" class="section-label" fill="rgba(100,181,246,0.55)">▸ Infrastructure & Numérique</text>

      <!-- Territoire & Société -->
      <rect x="20" y="706" width="1778" height="276" rx="14" fill="rgba(105,219,124,0.04)" stroke="rgba(105,219,124,0.15)" stroke-width="1.2"/>
      <text x="40" y="736" class="section-label" fill="rgba(105,219,124,0.55)">▸ Territoire, Société & Savoirs</text>

      <!-- ===== LINKS ===== -->
      <!-- Danemark → Groenland (regulation) -->
      <path class="link link-animated" data-rel="regulation" d="M200,168 Q530,270 860,500" stroke="#7986ff" stroke-width="1.8" fill="none" opacity="0.55" marker-end="url(#arr-regulation)"/>
      <!-- EU → Groenland (support) -->
      <path class="link" data-rel="support" d="M450,168 Q640,290 860,510" stroke="#cc5de8" stroke-width="1.6" fill="none" opacity="0.5" stroke-dasharray="7,5" marker-end="url(#arr-support)"/>
      <!-- Chine → Industrie Minière (finance) -->
      <path class="link link-animated" data-rel="finance" d="M700,168 Q580,360 430,510" stroke="#69db7c" stroke-width="1.8" fill="none" opacity="0.55" marker-end="url(#arr-finance)"/>
      <!-- USA → Groenland (influence) -->
      <path class="link link-animated" data-rel="influence" d="M910,165 Q910,330 910,470" stroke="#ff6b6b" stroke-width="2" fill="none" opacity="0.65" marker-end="url(#arr-influence)"/>
      <!-- Russie → Groenland (influence) -->
      <path class="link link-animated" data-rel="influence" d="M1100,160 Q1010,310 960,480" stroke="#ff6b6b" stroke-width="1.6" fill="none" opacity="0.5" marker-end="url(#arr-influence)"/>
      <!-- Groenland → Communautés (regulation) -->
      <path class="link" data-rel="regulation" d="M910,570 Q910,640 910,750" stroke="#7986ff" stroke-width="1.6" fill="none" opacity="0.55" marker-end="url(#arr-regulation)"/>
      <!-- Industrie → Groenland (finance) -->
      <path class="link" data-rel="finance" d="M460,520 Q660,515 840,510" stroke="#69db7c" stroke-width="1.6" fill="none" opacity="0.5" marker-end="url(#arr-finance)"/>
      <!-- Industrie → Métaux Rares -->
      <path class="link" data-rel="influence" d="M420,505 Q380,430 355,390" stroke="#ff6b6b" stroke-width="1.4" fill="none" opacity="0.45" marker-end="url(#arr-influence)"/>
      <!-- Industrie → Communautés (tension) -->
      <path class="link" data-rel="tension" d="M450,550 Q650,645 850,760" stroke="#ff9a5c" stroke-width="1.4" fill="none" opacity="0.5" stroke-dasharray="6,5" marker-end="url(#arr-tension)"/>
      <!-- Groenland → Greenland Connect (support) -->
      <path class="link" data-rel="support" d="M975,500 Q1090,440 1250,400" stroke="#cc5de8" stroke-width="1.4" fill="none" opacity="0.45" stroke-dasharray="6,5" marker-end="url(#arr-support)"/>
      <!-- Communautés → ONG (support) -->
      <path class="link" data-rel="support" d="M855,775 Q700,808 590,830" stroke="#cc5de8" stroke-width="1.3" fill="none" opacity="0.45" stroke-dasharray="6,5" marker-end="url(#arr-support)"/>
      <!-- Scientifiques → EIA (expertise) -->
      <path class="link" data-rel="expertise" d="M1130,862 Q1240,858 1340,862" stroke="#ffe066" stroke-width="1.4" fill="none" opacity="0.5" marker-end="url(#arr-expertise)"/>
      <!-- Climat → Groenland (expertise) -->
      <path class="link" data-rel="expertise" d="M1320,145 Q1160,270 990,470" stroke="#ffe066" stroke-width="1.4" fill="none" opacity="0.45" marker-end="url(#arr-expertise)"/>
      <!-- EU → Mines (regulation) -->
      <path class="link" data-rel="regulation" d="M405,205 Q360,370 360,420" stroke="#7986ff" stroke-width="1.3" fill="none" opacity="0.4" marker-end="url(#arr-regulation)"/>
      <!-- Médias → Communautés (influence) -->
      <path class="link" data-rel="influence" d="M195,858 Q510,808 840,775" stroke="#ff6b6b" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="5,5" marker-end="url(#arr-tension)"/>
      <!-- Greenland Connect → Tusass -->
      <path class="link" data-rel="support" d="M1415,400 Q1510,400 1580,400" stroke="#cc5de8" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="5,5" marker-end="url(#arr-support)"/>
      <!-- DataCenters → Cloud -->
      <path class="link" data-rel="support" d="M1415,468 Q1510,488 1528,510" stroke="#cc5de8" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="5,5" marker-end="url(#arr-support)"/>

      <!-- LIENS TERRITOIRE, SOCIÉTÉ & SAVOIRS (basés sur l'image originale) -->
      <!-- Communautés → Environnement (tension) -->
      <path class="link" data-rel="tension" d="M955,772 Q1020,762 1055,762" stroke="#ff9a5c" stroke-width="1.3" fill="none" opacity="0.45" stroke-dasharray="5,4" marker-end="url(#arr-tension)"/>
      <!-- Groenland → Environnement (expertise) -->
      <path class="link" data-rel="expertise" d="M940,560 Q1020,640 1075,730" stroke="#ffe066" stroke-width="1.2" fill="none" opacity="0.4" marker-end="url(#arr-expertise)"/>
      <!-- Environnement → Climatologues (expertise) -->
      <path class="link" data-rel="expertise" d="M1118,770 Q1190,790 1246,808" stroke="#ffe066" stroke-width="1.3" fill="none" opacity="0.5" marker-end="url(#arr-expertise)"/>
      <!-- Climatologues → Scientifiques (expertise) -->
      <path class="link" data-rel="expertise" d="M1250,840 Q1200,858 1148,862" stroke="#ffe066" stroke-width="1.3" fill="none" opacity="0.5" marker-end="url(#arr-expertise)"/>
      <!-- Scientifiques → EIA (expertise) — already present, keep -->
      <!-- ONG → Communautés (support, back-link) -->
      <!-- Populations → Communautés (support) -->
      <path class="link" data-rel="support" d="M430,782 Q580,778 864,772" stroke="#cc5de8" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="5,4" marker-end="url(#arr-support)"/>
      <!-- Narsaq → Communautés (support) -->
      <path class="link" data-rel="support" d="M630,840 Q740,820 862,790" stroke="#cc5de8" stroke-width="1.2" fill="none" opacity="0.38" stroke-dasharray="5,4" marker-end="url(#arr-support)"/>
      <!-- Médias → Populations (influence) -->
      <path class="link" data-rel="influence" d="M222,858 Q300,840 360,800" stroke="#ff6b6b" stroke-width="1.1" fill="none" opacity="0.35" stroke-dasharray="4,4" marker-end="url(#arr-influence)"/>

      <!-- ===== NODES ===== -->

      <!-- CENTRAL: Groenland -->
      <g class="node-group" data-id="groenland" data-cat="territory">
        <circle class="pulse-ring" cx="910" cy="515" r="38"/>
        <circle cx="910" cy="515" r="50" fill="rgba(100,181,246,0.1)" stroke="var(--accent)" stroke-width="2.5"/>
        <circle cx="910" cy="515" r="32" fill="rgba(100,181,246,0.18)" stroke="var(--accent)" stroke-width="2"/>
        <path d="M895,500 Q906,490 920,494 Q934,497 933,512 Q932,529 920,534 Q906,538 895,529 Q886,518 895,500 Z" fill="var(--accent)" opacity="0.85"/>
        <text x="910" y="580" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="13" fill="var(--accent)" letter-spacing="0.1em" font-weight="600">GROENLAND</text>
      </g>

      <!-- Gouvernement -->

// ── PANEL SIZING: match map-wrapper height ─────────────────────
function syncPanelHeight() {
  const wrapper = document.getElementById('map-wrapper');
  const panel = document.getElementById('detail-panel');
  const h = wrapper.getBoundingClientRect().height;
  panel.style.height = h + 'px';
}
window.addEventListener('resize', syncPanelHeight);
window.addEventListener('load', syncPanelHeight);
// Also re-sync after SVG renders (rAF)
requestAnimationFrame(() => { requestAnimationFrame(syncPanelHeight); });

// ── TOOLTIP ────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('tt-title');
const ttCat   = document.getElementById('tt-cat');
const ttDesc  = document.getElementById('tt-desc');

function showTooltip(e, id) {
  const d = nodes[id]; if (!d) return;
  ttTitle.textContent = d.label;
  ttCat.textContent = d.catLabel;
  ttCat.style.color = catColors[d.cat] || '#8892a4';
  ttDesc.textContent = d.desc;
  tooltip.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e) {
  let x = e.clientX + 18, y = e.clientY + 18;
  if (x + 275 > window.innerWidth)  x = e.clientX - 275;
  if (y + 145 > window.innerHeight) y = e.clientY - 145;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

// ── DETAIL PANEL ───────────────────────────────────────────────
const detailPanel  = document.getElementById('detail-panel');
const collapseTab  = document.getElementById('collapse-tab');
const dBadge       = document.getElementById('d-badge');
const dTitle       = document.getElementById('d-title');
const panelContent = document.getElementById('panel-content');
const panelScroll  = document.getElementById('panel-scroll');

collapseTab.addEventListener('click', () => {
  detailPanel.classList.toggle('open');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') detailPanel.classList.remove('open');
});

function showDetail(id) {
  const d = nodes[id]; if (!d) return;
  const color = catColors[d.cat] || '#888';

  dBadge.textContent = d.catLabel;
  dBadge.style.background = color + '22';
  dBadge.style.color = color;
  dBadge.style.border = '1px solid ' + color + '55';
  dTitle.textContent = d.label;

  let relsHTML = '';
  if (d.details.relations && d.details.relations.length) {
    const items = d.details.relations.map(r => `
      <li>
        <span class="rel-dot" style="background:${relColors[r.type]||'#888'}"></span>
        <span class="rel-info">
          <span class="rel-target">${r.target}</span>
          <span class="rel-type">${relLabels[r.type]||r.type}</span>
          <span class="rel-label">${r.label}</span>
        </span>
      </li>`).join('');
    relsHTML = `<div class="d-section"><h3>Relations</h3><ul class="d-relations">${items}</ul></div>`;
  }
  const tags = (d.details.tags||[]).map(t => `<span class="d-tag">${t}</span>`).join('');

  panelContent.innerHTML = `
    <div class="d-section"><h3>Contexte</h3><p>${d.details.contexte}</p> </div>
    <div class="d-section"><h3>Enjeux Clés</h3><p><strong>${d.details.enjeux}</strong></p> </div>
    ${relsHTML}
    ${tags ? `<div class="d-section"><h3>Mots-clés</h3><div>${tags}</div></div>` : ''}
  `;
  panelScroll.scrollTop = 0;
  detailPanel.classList.add('open');
}

// ── NODE EVENTS ────────────────────────────────────────────────
document.querySelectorAll('.node-group').forEach(el => {
  const id = el.dataset.id;
  el.addEventListener('mouseenter', e => showTooltip(e, id));
  el.addEventListener('mousemove',  moveTooltip);
  el.addEventListener('mouseleave', hideTooltip);
  el.addEventListener('click', () => { hideTooltip(); showDetail(id); });
});

// ── FILTERS ────────────────────────────────────────────────────
let activeCats = new Set(['state','industry','civil','science','territory']);
let activeRels = new Set(['finance','regulation','influence','support','expertise','tension']);

document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    const cat = btn.dataset.cat;
    if (cat === 'all') {
      if (activeCats.size === 5) {
        activeCats.clear();
        document.querySelectorAll('.filter-btn[data-cat]:not([data-cat="all"])').forEach(b => b.classList.remove('active'));
      } else {
        activeCats = new Set(['state','industry','civil','science','territory']);
        document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.add('active'));
      }
    } else {
      activeCats.has(cat) ? (activeCats.delete(cat), btn.classList.remove('active'))
                          : (activeCats.add(cat),    btn.classList.add('active'));
      const allBtn = document.querySelector('.filter-btn[data-cat="all"]');
      activeCats.size === 5 ? allBtn.classList.add('active') : allBtn.classList.remove('active');
    }
    applyFilters();
  });
});

document.querySelectorAll('.legend-item[data-rel]').forEach(item => {
  item.addEventListener('click', () => {
    const rel = item.dataset.rel;
    activeRels.has(rel) ? (activeRels.delete(rel), item.classList.remove('active'))
                        : (activeRels.add(rel),    item.classList.add('active'));
    applyFilters();
  });
});

function applyFilters() {
  document.querySelectorAll('.node-group').forEach(el => {
    const cat = el.dataset.cat;
    const show = !cat || activeCats.has(cat);
    el.style.opacity = show ? '' : '0.06';
    el.style.pointerEvents = show ? '' : 'none';
  });
  document.querySelectorAll('.link').forEach(el => {
    const rel = el.dataset.rel;
    el.style.opacity = (!rel || activeRels.has(rel)) ? '' : '0.04';
  });
}
</script>
</body>
